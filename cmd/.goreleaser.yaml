# cmd/.goreleaser.yaml
version: 2

# コンポーネント名をプロジェクト名として使用
project_name: "{{ .Env.COMPONENT }}"

before:
  hooks:
    - go -C cmd mod tidy

builds:
  - id: cli-binary
    dir: ./cmd                         # go.mod があるディレクトリを作業ディレクトリに指定
    main: ./{{ .Env.COMPONENT }}       # 例: ./deprun や ./template
    binary: "{{ .Env.COMPONENT }}"     # 出力バイナリ名
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"