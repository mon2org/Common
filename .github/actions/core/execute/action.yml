name: 'Core Execute'
description: 'セキュリティ検証、環境構築、メイン処理、PR作成まで'

inputs:
  run-command:
    required: true
  runner:
    required: false
    default: 'ubuntu-latest-1-vcpu'
  create-pr:
    required: false
    default: 'false'
  pr-branch:
    required: false
    default: 'chore/sync-templates'
  pr-title:
    required: false
    default: 'chore: テンプレート・共通設定の自動同期'

runs:
  using: 'composite'
  steps:
    - name: Run Security Guard
      uses: mon2org/Common/.github/actions/core/guard@main
      with:
        run-command: ${{ inputs.run-command }}
        runner: ${{ inputs.runner }}
        create-pr: ${{ inputs.create-pr }}

    - name: Setup mise environment
      uses: mon2org/Common/.github/actions/wrap/mise@main

    - name: Checkout target repository
      uses: mon2org/Common/.github/actions/wrap/checkout@main

    - name: Run task script
      shell: bash
      env:
        RUN_COMMAND: ${{ inputs.run-command }}
      run: bash "${{ github.action_path }}/run.sh"

    - name: Create Pull Request if needed
      if: inputs.create-pr == 'true'
      uses: mon2org/Common/.github/actions/wrap/create-pull-request@main
      with:
        branch: ${{ inputs.pr-branch }}
        title: ${{ inputs.pr-title }}