name: 'Core Guard'
description: 'ワークフロー実行前の権限・パラメータ・トリガー検証'

inputs:
  run-command:
    required: true
  runner:
    required: true
  create-pr:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run Checker Script
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        RUN_COMMAND: ${{ inputs.run-command }}
        RUNNER: ${{ inputs.runner }}
        CREATE_PR: ${{ inputs.create-pr }}
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/checker.sh"