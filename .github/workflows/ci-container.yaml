name: CI(Container)

on:
  push:
    branches:
      - main
    paths:
      - "container/**"
      - ".github/workflows/ci-container.yaml"
  pull_request:
    paths:
      - "container/**"
      - ".github/workflows/ci-container.yaml"

jobs:
  # 1. container/ 配下のディレクトリを自動検知してマトリックスを生成するジョブ
  detect:
    name: コンテナの自動検知
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.set-matrix.outputs.containers }}
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: ディレクトリの走査とJSON生成
        id: set-matrix
        run: |
          CONTAINERS=$(find container -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          echo "検出されたコンテナ: $CONTAINERS"
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT

  # 2. 自動検知されたコンテナごとに並列で構文解析・ビルド・スキャンを実行するジョブ
  ci:
    name: 構文解析・ビルド・脆弱性スキャン (${{ matrix.container }})
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect.outputs.containers) }}
    permissions:
      contents: read
      pull-requests: write # reviewdog やコメント投稿に必要

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: hadolint による Dockerfile の静的解析
        uses: reviewdog/action-hadolint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include: "container/${{ matrix.container }}/Dockerfile"
          reporter: github-pr-review
          level: error

      - name: Docker Buildx のセットアップ
        uses: docker/setup-buildx-action@v3

      - name: Docker イメージのビルド
        uses: docker/build-push-action@v5
        with:
          context: ./container/${{ matrix.container }}
          file: ./container/${{ matrix.container }}/Dockerfile
          load: true
          tags: ${{ matrix.container }}-image:test

      # 修正: id付与と、outcomeによる判定を行えるように調整
      - name: Trivy による脆弱性スキャン
        uses: aquasecurity/trivy-action@v0.35.0
        id: trivy # ステップを参照するためのID
        with:
          image-ref: '${{ matrix.container }}-image:test'
          format: 'table'
          exit-code: '1' # 脆弱性があればこのステップを失敗（failure）させる
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results-${{ matrix.container }}.txt'
        continue-on-error: true # エラーでも後続のコメント処理を走らせるために一時的に継続

      - name: Trivy 結果の整形
        if: always()
        run: |
          echo "## 🛡️ コンテナ脆弱性スキャン結果: \`${{ matrix.container }}\`" > trivy-comment-${{ matrix.container }}.md
          echo "" >> trivy-comment-${{ matrix.container }}.md
          if [ -s trivy-results-${{ matrix.container }}.txt ]; then
            echo "以下のスキャン結果が検出されました。" >> trivy-comment-${{ matrix.container }}.md
            echo "\`\`\`" >> trivy-comment-${{ matrix.container }}.md
            cat trivy-results-${{ matrix.container }}.txt >> trivy-comment-${{ matrix.container }}.md
            echo "\`\`\`" >> trivy-comment-${{ matrix.container }}.md
          else
            echo "✅ スキャン結果ファイルが空です。" >> trivy-comment-${{ matrix.container }}.md
          fi

      - name: PR へのコメント集約（Sticky Comment）
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: trivy-comment-${{ matrix.container }}.md
          header: trivy-report-${{ matrix.container }}

      # 修正: ファイルサイズではなく、Trivyステップの実行結果(outcome)で判定
      - name: 脆弱性チェックの判定
        if: always()
        run: |
          if [ "${{ steps.trivy.outcome }}" == "failure" ]; then
            echo "❌ [${{ matrix.container }}] 重大な脆弱性が検出されたため、CIを失敗させます。"
            exit 1
          else
            echo "✅ [${{ matrix.container }}] 重大な脆弱性は検出されませんでした。"
          fi
