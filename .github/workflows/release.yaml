name: Release & Container Publish

on:
  push:
    branches:
      - main
    tags:
      - 'container-*.v*' # 例: container-base.v0.1.0 など

jobs:
  # 1. Release-Please によるバージョン・リリース管理（mainブランチプッシュ時のみ実行）
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: .github/repo/release-please-config.json
          manifest-file: .github/repo/.release-please-manifest.json

  # 2. container直下でDockerfileを含むサブディレクトリを動的に検出（タグプッシュ時のみ実行）
  detect:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/container-')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Container Directories
        id: set-matrix
        run: |
          # container直下（maxdepth 2）でDockerfileを持つディレクトリを検出し、JSON配列に変換
          DIRECTORIES=$(find container -maxdepth 2 -name Dockerfile -exec dirname {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=${DIRECTORIES}" >> $GITHUB_OUTPUT
          echo "Detected containers: ${DIRECTORIES}"

  # 3. 検出されたディレクトリをマトリックスとして並行ビルド（タグプッシュ時のみ実行）
  build-and-push:
    needs: detect
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/container-')
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 4. プッシュされたタグが、現在のマトリックス対象のコンテナのものか判定する
      - name: Validate Tag Matches Container
        id: validate
        run: |
          DIR="${{ matrix.dir }}" # 例: container/base
          CONTAINER_NAME=$(basename "$DIR") # 例: base
          EXPECTED_PREFIX="container-${CONTAINER_NAME}."
          
          TAG="${{ github.ref_name }}"
          # タグがこのコンテナのものでなければ処理をスキップ
          if [[ "$TAG" != "$EXPECTED_PREFIX"* ]]; then
            echo "Tag $TAG does not match container$CONTAINER_NAME. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "container_name=${CONTAINER_NAME}" >> $GITHUB_OUTPUT

      - name: Docker Buildx の設定
        if: steps.validate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry (GHCR) へログイン
        if: steps.validate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージ名とバージョンの整形
        if: steps.validate.outputs.skip != 'true'
        id: prep
        run: |
          CONTAINER_NAME="${{ steps.validate.outputs.container_name }}"
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/container-${CONTAINER_NAME}"
          TAG="${{ github.ref_name }}"
          PREFIX="container-${CONTAINER_NAME}-"
          VERSION="${TAG#$PREFIX}"
          
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: コンテナのビルドとプッシュ（ダイジェスト出力付き）
        if: steps.validate.outputs.skip != 'true'
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.version }}${{ steps.prep.outputs.image }}:latest
          outputs: type=image,oci-mediatypes=true,compression=gzip

      - name: リリースノートへのSHA256ダイジェスト追記
        if: steps.validate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          BODY=$(gh release view "$TAG" --json body -q .body 2>/dev/null || echo "")
          NEW_BODY="${BODY}"$'\n\n'"### 🐳 Container Image Digest"$'\n'
          NEW_BODY="${NEW_BODY}- Image: \`${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.version }}\`"$'\n'
          NEW_BODY="${NEW_BODY}- Digest: \`${DIGEST}\`"

          gh release edit "$TAG" --notes "$NEW_BODY" || true
