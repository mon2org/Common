name: Build Go Binaries

on:
  push:
    tags:
      - "cmd/*/*" # 例: cmd/deprun/v0.1.0 に反応

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'cmd/go.mod' # go.mod のパスを指定

      - name: Extract component name
        id: parse
        run: |
          # タグ名 (cmd/deprun/v0.1.0) から "deprun" を抽出
          COMPONENT=$(echo "${{ github.ref_name }}" | cut -d'/' -f2)
          echo "component=${COMPONENT}" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          # 共通の設定ファイル (cmd/.goreleaser.yaml) を指定
          args: release --clean -f cmd/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser 内で {{ .Env.COMPONENT }} として参照する環境変数
          COMPONENT: ${{ steps.parse.outputs.component }}